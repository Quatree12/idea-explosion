<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IDEA EXPLOSION">
<meta name="description" content="The Creative Chaos Engine — transforme des combinaisons d'idées improbables en concepts exploitables.">
<title>IDEA EXPLOSION — The Creative Chaos Engine</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="shard shard-a"></div>
  <div class="shard shard-b"></div>
</div>

<header class="topbar glass">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">
      <strong>IDEA EXPLOSION</strong>
      <em>The Creative Chaos Engine</em>
    </span>
  </div>
  <button class="icon-btn" data-nav="vault" aria-label="Ouvrir la bibliothèque">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span class="badge" id="vaultBadge" hidden>0</span>
  </button>
</header>

<main id="app" class="screens"></main>

<nav class="tabbar glass" aria-label="Navigation principale">
  <button class="tab" data-nav="lab" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>
    <span>Lab</span>
  </button>
  <button class="tab" data-nav="fusion">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="4"/></svg>
    <span>Fusion</span>
  </button>
  <button class="tab" data-nav="vault">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg>
    <span>Vault</span>
  </button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
